<text x="1040" y="553" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">podciągających dla przycisków.</text>
<text x="1040" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#233348" font-weight="bold">Oba razem: bypass efektu.</text>
