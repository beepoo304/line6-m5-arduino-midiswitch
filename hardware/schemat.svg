<text x="60" y="1040" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#233348" font-weight="normal">Piny DIN 1 i 3: wolne. Kabel MIDI OUT switcha → MIDI IN w M5.</text>
<text x="1040" y="824" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">4  ZASILANIE NANO</text>
<text x="1040" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">+9 V DC → VIN</text>
<text x="1040" y="912" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">Minus zasilania → GND</text>
<text x="1040" y="952" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Alternatywnie: zasilanie przez USB.</text>
<text x="1040" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#a23b35" font-weight="bold">9 V nie podłączaj do pinu 5 V.</text>
<text x="1040" y="1023" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#233348" font-weight="normal">Polaryzację gniazda DC sprawdź miernikiem.</text>
<text x="45" y="1100" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">* 1,5 kΩ: zachowawczy dobór do bezpośredniego sterowania anod z D9/D10; jasność trzeba sprawdzić w egzemplarzu.</text>
<text x="45" y="1131" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Istniejące rezystory sprawdź przed zmianą. Rysunek określa sieci elektryczne, nie położenie nóżek na płytce.</text>
<text x="45" y="1162" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Numery fizycznych nóżek LED zależą od modelu. DIN: kieruj się numerami styków — widok lutowania jest lustrzany.</text>
<text x="45" y="1196" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5c6a79" font-weight="normal">Wersja 2026-09-12 • Bez MIDI IN • Szczegółowa tabela nóżek oraz objaśnienia: hardware/POLACZENIA.md</text>
