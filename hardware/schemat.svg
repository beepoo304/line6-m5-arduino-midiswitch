<path d="M415 1000 L730 1000" stroke="#216d97" stroke-width="3" fill="none"/>
<text x="750" y="1007" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#233348" font-weight="bold">DIN pin 2</text>
<text x="60" y="1040" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#233348" font-weight="normal">DIN pins 1 and 3: unconnected. Connect switch MIDI OUT → M5 MIDI IN.</text>
<text x="1040" y="824" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">4  NANO POWER SUPPLY</text>
<text x="1040" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">+9 V DC → VIN</text>
<text x="1040" y="912" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#233348" font-weight="bold">DC negative → GND</text>
<text x="1040" y="952" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Alternatively, power the Nano via USB.</text>
<text x="1040" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#a23b35" font-weight="bold">Do not connect 9 V to the 5 V pin.</text>
<text x="1040" y="1023" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#233348" font-weight="normal">Check DC jack polarity with a multimeter.</text>
<text x="45" y="1100" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">* 1.5 kΩ: conservative values for direct anode drive from D9/D10. Verify display brightness on the actual unit.</text>
<text x="45" y="1131" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Check existing resistors before replacing them. This drawing shows electrical connections, not physical board pin locations.</text>
<text x="45" y="1162" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">LED lead numbers depend on the display model. Use DIN contact numbers: the solder-side view is mirrored.</text>
<text x="45" y="1196" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5c6a79" font-weight="normal">Revision 2026-09-12 • MIDI OUT only • Detailed connection table and notes (Polish): hardware/POLACZENIA.md</text>
