<text x="1040" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Przytrzymanie: przewijanie presetów.</text>
<text x="1040" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#233348" font-weight="bold">Wyświetlanie: 01–24.</text>
