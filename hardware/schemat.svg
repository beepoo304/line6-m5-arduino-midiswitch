<text x="1130" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#233348" font-weight="normal">Momentary NO contact; closes to GND</text>
<text x="1040" y="495" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#233348" font-weight="normal">INPUT_PULLUP enabled in firmware.</text>
<text x="1040" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">No external pull-up resistors</text>
<text x="1040" y="553" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">are required for the switches.</text>
<text x="1040" y="613" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#233348" font-weight="bold">Press both: effect bypass.</text>
<text x="1040" y="647" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">The next preset selection enables the effect.</text>
<text x="1040" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#233348" font-weight="normal">Hold either switch to scroll through presets.</text>
<text x="1040" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#233348" font-weight="bold">Display range: 01-24.</text>
